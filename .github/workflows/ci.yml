name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Arch Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base

    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git
          rust
          cargo-audit
          pkgconf
          gtk4
          gtk4-layer-shell

      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Audit dependencies
        run: cargo audit --no-yanked

      - name: Check installer syntax
        run: bash -n install.sh install-remote.sh

      - name: Test installer dependency failures
        run: bash tests/install-dependency-query.sh

      - name: Test installer without a systemd user instance
        run: bash tests/install-systemd-unreachable.sh

      - name: Check whitespace
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- .; then
            echo '::error::Trailing whitespace found'
            exit 1
          fi
