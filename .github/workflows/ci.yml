name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Arch Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base

    steps:
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git
          rust
          cargo-audit
          pkgconf
          python
          gtk4
          gtk4-layer-shell
          xorg-server-xvfb
          xorg-xauth

      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # Container jobs run as a different user than the checkout owner, so git
      # refuses the workspace as "dubious ownership". The build script probes git
      # with the global and system config disabled, so the ownership itself has
      # to match, not just a safe.directory entry.
      - name: Trust the mounted workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Test result first paint and overlay disposal on GTK
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          VELLUM_REQUIRE_GTK_TESTS: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" cargo test --locked -p vellum-ui first_frame_work_runs_once_after_paint_not_during_present -- --test-threads=1
          xvfb-run -a -s "-screen 0 1280x800x24" cargo test --locked -p vellum-ui closing_overlay_releases_full_screen_and_input_method_while_result_stays_alive -- --test-threads=1
          xvfb-run -a -s "-screen 0 1280x800x24" cargo test --locked -p vellum-ui native_ocr_compact_layout_coalesces_edits_and_closes_without_workspace -- --ignored --test-threads=1

      - name: Audit dependencies
        run: cargo audit --no-yanked

      - name: Check installer syntax
        run: bash -n install.sh install-remote.sh

      - name: Test installer dependency failures
        run: bash tests/install-dependency-query.sh

      - name: Test installer without a systemd user instance
        run: bash tests/install-systemd-unreachable.sh

      - name: Test fixed source commit and release packaging
        run: |
          bash tests/install-remote-fixed.sh
          python3 tests/package-release.py

      - name: Test versioned install fault matrix
        run: bash tests/release-manager.sh

      - name: Check whitespace
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- .; then
            echo '::error::Trailing whitespace found'
            exit 1
          fi
