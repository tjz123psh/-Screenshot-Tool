name: Dispatch the tagged release

# The release workflow stays deliberately manual. This tiny dispatcher exists
# because the local delivery account may push tags over SSH without having a
# GitHub API token available; a tag push can still ask the release workflow to
# run for that exact immutable tag with the repository token.
on:
  push:
    tags:
      - 'v*'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Ask the release workflow to run
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release.yml on this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$GITHUB_REF_NAME"
