<!doctype html>
<meta charset="utf-8">
<title>Longshot synthetic browser regression</title>
<style>
* { box-sizing: border-box; }
html { scrollbar-width: none; }
body { margin: 0; background: #fff; color: #20242b; font: 15px/1.5 sans-serif; }
main { width: 620px; margin: 0 auto; padding: 20px; }
h1 { margin: 0 0 16px; font-size: 24px; }
article { height: 92px; border-bottom: 1px solid #dedee3; padding: 12px 0; }
h2 { margin: 0; font-size: 16px; font-weight: 600; }
p { margin: 5px 0; color: #656b75; }
span { float: right; color: #32719e; font: 13px monospace; }
</style>
<main><h1>长截图测试 · Scroll capture</h1><section></section></main>
<script>
const names = ["滚动时不应漏掉这一行", "Same layout, different content", "重复卡片不代表同一个位置", "A short note with punctuation: 1, 2, 3.", "返回已截图的内容时不应重复追加"];
for (let i = 0; i < 20; ++i) {
  const article = document.createElement("article");
  article.innerHTML = `<h2><span>#${String(i + 1).padStart(3, "0")}</span>${names[i % names.length]}</h2><p>项目 ${i + 1} · Preview ${i * 7 + 13} · 保留完整文字、边框和空白页边。</p>`;
  document.querySelector("section").append(article);
}
</script>
