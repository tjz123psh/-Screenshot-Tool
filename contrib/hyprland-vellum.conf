# Example Hyprland configuration for vellum (classic hyprland.conf syntax).
#
# This file is never read automatically. Copy what you want into your own
# config, or `source` it. If your Hyprland uses the Lua config format instead,
# see hyprland-vellum.lua next to this file.
#
# `vellum shortcuts install` can write the binds section below into a real
# hyprland.conf by itself (backup, reload, configerrors, rollback on failure).
# It never writes a Lua config.

# The pin window and the OCR/translation result window are reference overlays:
# they should float above the tiling layout instead of taking a tile.
#
# Both windows also ask the compositor to float them from code (~60 ms after
# map), so these rules are optional. Keeping them removes the brief tiled flash
# before that call lands, and lets you pin down a default size.
#
# Match on class, not title: Hyprland's `class` is the GTK app-id, which is
# stable, while the titles are localized ("vellum 钉图", "提取的文字") and would
# break the moment the UI language changes.
#
# Hyprland has no separate "no border" toggle, so use bordersize 0.
windowrulev2 = float, class:^(ai\.vellum\.pin)$
windowrulev2 = bordersize 0, class:^(ai\.vellum\.pin)$
windowrulev2 = float, class:^(ai\.vellum\.result)$
windowrulev2 = size 560 400, class:^(ai\.vellum\.result)$

# The stage-1 selection overlay, the long-shot panel and the selection
# highlight are layer-shell surfaces (namespaces vellum-overlay,
# vellum-longshot, vellum-longshot-highlight), not toplevel windows, so they
# need no window rule. Use `hyprctl layers` to confirm they map.

# Spawn vellumctl, not vellum: it is the thin hotkey client that talks to the
# control service without linking GTK. Absolute path because compositors do not
# spawn with your login PATH.
bind = SUPER, Print, exec, $HOME/.local/bin/vellumctl region       # vellum 框选
bind = SUPER SHIFT, Print, exec, $HOME/.local/bin/vellumctl long   # vellum 长截图
bind = SUPER CTRL, Print, exec, $HOME/.local/bin/vellumctl pin-last # vellum 钉图
